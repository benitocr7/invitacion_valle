<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación Iglesia Adventista</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="invitacion">

    <!-- FOTO -->
    <div class="foto">
      <img src="foto_iglesia.png" alt="Iglesia Adventista del Séptimo Día">
    </div>

    <!-- TEXTO -->
    <div class="contenido">

      <p class="linea-invitacion" contenteditable="true">Tenemos el agrado de invitarte a nuestra:</p>

      <h1 class="titulo-principal" contenteditable="true">Invitación Especial</h1>

      <h2 class="titulo-iglesia" contenteditable="true">IGLESIA <span class="acento">Adventista</span></h2>

      <p class="fecha-destacada" contenteditable="true">Sábado, 5 de Septiembre de 2026</p>

      <p class="culto" contenteditable="true">Culto especial</p>
      <p class="subtexto" contenteditable="true">Un encuentro de fe y esperanza</p>
      <p class="hora-top" contenteditable="true">🕐 09H00</p>

      <h3 class="nombre-iglesia" contenteditable="true">Iglesia Adventista del Séptimo Día</h3>
      <p class="ubicacion" contenteditable="true">El Valle</p>
      <p class="ubicacion" contenteditable="true">Calles Cuenca y Chone</p>

      <div class="datos">
        <div class="dato">
          <span class="dato-titulo" contenteditable="true">Lugar</span>
          <span class="dato-valor" contenteditable="true">El Valle</span>
        </div>
        <div class="dato">
          <span class="dato-titulo" contenteditable="true">Fecha</span>
          <span class="dato-valor" contenteditable="true">12 de septiembre</span>
        </div>
        <div class="dato">
          <span class="dato-titulo" contenteditable="true">Hora</span>
          <span class="dato-valor" contenteditable="true"> 09H00</span>
        </div>
      </div>

      <button class="boton" contenteditable="true">ACEPTAR INVITACIÓN</button>

    </div>

  </div>

</body>
</html>
